name: Lint check

on: 
  push:
    branches: develop
  pull_request:
    branches: develop
  workflow_dispatch:

jobs: 
  build_ubuntu:
      runs-on: ubuntu-latest
      steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Setup
        run: make setup

      - name: Check
        run: make check

      - name: Fail if files changed
        run: git diff --exit-code